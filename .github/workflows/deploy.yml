# Deploys only themes/refungi-child and (optionally) plugins/refungi-custom.
# Credentials come from GitHub Actions repository secrets. Nothing in this
# file is a password, key, or hostname.
#
# Port 22 (the default) is SSH. Key auth uses easingthemes/ssh-deploy.
# Password auth on any port other than 21 uses the same rsync flags.
# Port 21 is plain FTP via lftp. o2switch Autorisation SSH blocks GitHub
# runners on port 22, and FTPS data connections use that same allowlist, so
# FTPS is not the fallback. mirror --delete is scoped to the validated
# directory. dangerous-clean-slate is not used.

name: Deploy custom code

on:
  pull_request:
    paths:
      - "themes/refungi-child/**"
      - "plugins/refungi-custom/**"
      - ".github/**"
      - "README.md"
      - ".gitignore"
  push:
    branches:
      - main
    paths:
      - "themes/refungi-child/**"
      - "plugins/refungi-custom/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refungi-deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check theme, plugin, and deploy guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP and FTP test tools
        run: |
          if ! command -v php >/dev/null 2>&1 || ! command -v lftp >/dev/null 2>&1 || ! python3 -c 'import pyftpdlib' >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y php-cli lftp python3-pyftpdlib
          fi

      - name: Syntax and deploy-target tests
        run: |
          php -l themes/refungi-child/functions.php
          php -l plugins/refungi-custom/refungi-custom.php
          if grep -q '^Template: PARENT_THEME_SLUG$' themes/refungi-child/style.css; then
            echo "::warning::Template is still PARENT_THEME_SLUG. The folder may deploy, but do not activate the theme in wp-admin until that header is the real parent directory name."
          fi
          bash .github/scripts/run-tests.sh

  deploy:
    name: Deploy child theme and custom plugin
    needs: check
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require secrets and safe remote paths
        id: preflight
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_REMOTE_THEME_PATH: ${{ secrets.SFTP_REMOTE_THEME_PATH }}
          SFTP_REMOTE_PLUGIN_PATH: ${{ secrets.SFTP_REMOTE_PLUGIN_PATH }}
        run: bash .github/scripts/deploy-preflight.sh

      - name: Confirm remote theme directory (SSH key)
        if: ${{ steps.preflight.outputs.transport == 'ssh' && steps.preflight.outputs.auth == 'key' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.preflight.outputs.port }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
        run: bash .github/scripts/ssh-key-guard.sh "${{ steps.preflight.outputs.theme_path }}"

      - name: Deploy child theme (SSH key)
        if: ${{ steps.preflight.outputs.transport == 'ssh' && steps.preflight.outputs.auth == 'key' }}
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SFTP_KEY }}
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_USER: ${{ secrets.SFTP_USER }}
          REMOTE_PORT: ${{ steps.preflight.outputs.port }}
          SOURCE: themes/refungi-child/
          TARGET: ${{ steps.preflight.outputs.theme_path }}
          ARGS: "-rlzvc --delete --no-owner --no-group --omit-dir-times --chmod=D755,F644"
          EXCLUDE: "node_modules/,.git/,.github/"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=accept-new, -o ConnectTimeout=20"

      - name: Confirm remote plugin directory (SSH key)
        if: ${{ steps.preflight.outputs.transport == 'ssh' && steps.preflight.outputs.auth == 'key' && steps.preflight.outputs.deploy_plugin == 'true' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.preflight.outputs.port }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
        run: bash .github/scripts/ssh-key-guard.sh "${{ steps.preflight.outputs.plugin_path }}"

      - name: Deploy custom plugin (SSH key)
        if: ${{ steps.preflight.outputs.transport == 'ssh' && steps.preflight.outputs.auth == 'key' && steps.preflight.outputs.deploy_plugin == 'true' }}
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SFTP_KEY }}
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_USER: ${{ secrets.SFTP_USER }}
          REMOTE_PORT: ${{ steps.preflight.outputs.port }}
          SOURCE: plugins/refungi-custom/
          TARGET: ${{ steps.preflight.outputs.plugin_path }}
          ARGS: "-rlzvc --delete --no-owner --no-group --omit-dir-times --chmod=D755,F644"
          EXCLUDE: "node_modules/,.git/,.github/"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=accept-new, -o ConnectTimeout=20"

      - name: Deploy over SSH with password
        if: ${{ steps.preflight.outputs.transport == 'ssh' && steps.preflight.outputs.auth == 'password' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.preflight.outputs.port }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          THEME_PATH: ${{ steps.preflight.outputs.theme_path }}
          PLUGIN_PATH: ${{ steps.preflight.outputs.plugin_path }}
          DEPLOY_PLUGIN: ${{ steps.preflight.outputs.deploy_plugin }}
        run: bash .github/scripts/sftp-password-deploy.sh

      - name: Deploy over plain FTP (port 21)
        if: ${{ steps.preflight.outputs.transport == 'ftp' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.preflight.outputs.port }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          THEME_PATH: ${{ steps.preflight.outputs.theme_path }}
          PLUGIN_PATH: ${{ steps.preflight.outputs.plugin_path }}
          DEPLOY_PLUGIN: ${{ steps.preflight.outputs.deploy_plugin }}
        run: bash .github/scripts/ftp-password-deploy.sh
